<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cloudflare.com">
    <title>MIZIKOTOP</title>
    <style>
        body {
            margin: 0;
            min-height: 100%;
            background-color: #dba209;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        video {
            max-width: 80%;
            max-height: 80%;
            display: block;
            margin: 0 auto;
        }

        .instagram-link {
            display: inline-block;
            margin-top: 20px;
            color: white;
            font-size: 40px;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .instagram-link:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="container">

        <video autoplay muted>
          <source src="intro3.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <a href="https://instagram.com" target="_blank" style="color: white; font-size: 24px; text-decoration: none;">
      <i class="fa-brands fa-instagram"></i>
    </a>
    </div>

</body>
</html>
