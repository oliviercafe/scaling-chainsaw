<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>MIZIKOTOP</title>
    <style>
        body {
            margin: 0;
            min-height: 100%;
            background-color: #dba209;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        video {
            max-width: 80%;
            max-height: 80%;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://instagram.com/mizikotop" target="_blank"><i class="fa fa-instagram" style="font-size:48px;color:white"></i></a>
        <video id="intro" autoplay loop muted controls playsinline>
          <source src="intro3.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <button id="muteBtn" onclick="toggleMute()" style="position: absolute; bottom: 15px; right: 15px; z-index: 10; background: rgba(0,0,0,0.6); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 14px;">
            Unmute
          </button>
    </div>

    <script>
        function toggleMute() {
            const video = document.getElementById('intro');
            const btn = document.getElementById('muteBtn');
            video.muted = !video.muted;
            btn.textContent = video.muted ? 'Unmute' : 'Mute';
        }
    </script>
</body>
</html>
