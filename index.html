<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIZIKOTOP</title>
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Liaison avec le fichier CSS externe -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <a href="https://instagram.com/mizikotop" target="_blank" class="instagram-link">
            <i class="fa fa-instagram"></i>
        </a>
        <video id="intro" autoplay loop muted playsinline>
            <source src="intro3.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <button id="muteBtn" onclick="toggleMute()">Unmute</button>
    </div>

    <script>
        function toggleMute() {
            const video = document.getElementById('intro');
            const btn = document.getElementById('muteBtn');
            video.muted = !video.muted;
            btn.textContent = video.muted ? 'Unmute' : 'Mute';
        }
    </script>
</body>
</html>
